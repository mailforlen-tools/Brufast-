<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brufast</title>
<meta name="description" content="Brufast — train and metro in Brussels as one self-healing network (NMBS-SNCB + STIB-MIVB).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <span class="mark"><b>Bru</b>fast</span>
    <span class="tag" id="tagline"></span>
    <div class="tools">
      <div class="langsel" id="lang" role="group" aria-label="Language"></div>
      <a class="ghlink" href="https://github.com/mailforlen-tools/Brufast-" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>

  <div class="principle" id="principle"></div>

  <div class="grid">
    <div class="mapcard">
      <div id="map" role="img"></div>
      <div class="maplegend" id="legend"></div>
    </div>

    <div>
      <div class="panel">
        <h2 id="hRoute"></h2>
        <label for="from" id="lFrom"></label><select id="from"></select>
        <button class="swap" id="swap" type="button"></button>
        <label for="to" id="lTo"></label><select id="to"></select>
      </div>
      <div class="panel">
        <h2 id="hDisr"></h2>
        <div class="chips" id="metroChips"></div>
        <div class="sub" id="lTrain"></div>
        <div class="chips" id="trainChips"></div>
        <div class="sub" id="clickHint"></div>
        <div class="chips" id="segChips"></div>
        <label class="check"><input type="checkbox" id="tramToggle" checked> <span id="lTram"></span></label>
      </div>
      <div class="panel">
        <h2 id="hItin"></h2>
        <div class="itin" id="itin" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
